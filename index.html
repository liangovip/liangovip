      position: relative;
      isolation: isolate;
    }

    .shine-card::before,

      content: '';
      pointer-events: none;
    }

      position: absolute;
      inset: 0;
      opacity: 0.42;
      transition: opacity 280ms ease, filter 280ms ease;
    }

      position: absolute;

      left: -140%;
      width: 65%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);

                    className="rounded-full bg-white/10 h-7 w-7 flex items-center justify-center hover:bg-white/20 text-white/60 hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                {serviceSubmitted ? (
                  <div className="py-12 text-center">
                    <div className="h-14 w-14 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-2xl mx-auto mb-4">
                      ✓
                    </div>
                    <h4 className="text-lg font-bold text-white">申请已成功提交！</h4>
                    <p className="text-xs text-white/60 mt-2 max-w-xs mx-auto">
                      已派发至 MOORE PWA 自动化执行队列，专属客户经理将在 2 小时内于 Telegram 取得联系。
                    </p>
                  </div>
                ) : (
                  <form onSubmit={handleServiceSubmit} className="space-y-4 text-xs">
                    <div>
                      <label className="block text-white/70 mb-1 font-medium">项目名称 (Project Name) *</label>
                      <input
                        required
                        type="text"
                        placeholder="例如：Nexa DEX / Rainbow Quant"
                        value={serviceForm.projectName}
                        onChange={(e) => setServiceForm({ ...serviceForm, projectName: e.target.value })}
                        className="w-full rounded-xl border border-white/15 bg-black/50 px-3.5 py-2.5 text-white placeholder-white/30 focus:border-amber-400 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-amber-300 mb-1 font-semibold">
                        目标社群名称 (Telegram Group Name / Link) *
                      </label>
                      <input
                        required
                        type="text"
                        placeholder="例如：@MyToken_Official 或 https://t.me/yourgroup"
                        value={serviceForm.groupName}
                        onChange={(e) => setServiceForm({ ...serviceForm, groupName: e.target.value })}
                        className="w-full rounded-xl border border-amber-500/50 bg-black/60 px-3.5 py-2.5 text-white placeholder-amber-200/30 focus:border-amber-400 focus:outline-none shadow-[0_0_15px_rgba(245,158,11,0.1)]"
                      />
                      <span className="text-[10px] text-white/40 mt-1 block">用于为您部署 TG/WA 智能机器人、精准引流打粉或社群托管对接</span>
                    </div>

                    <div>
                      <label className="block text-white/70 mb-1 font-medium">官方对接人 Telegram Handle / 微信 *</label>
                      <input
                        required
                        type="text"
                        placeholder="例如：@founder_web3 / tgusername"
                        value={serviceForm.contactHandle}
                        onChange={(e) => setServiceForm({ ...serviceForm, contactHandle: e.target.value })}
                        className="w-full rounded-xl border border-white/15 bg-black/50 px-3.5 py-2.5 text-white placeholder-white/30 focus:border-amber-400 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-white/70 mb-2 font-medium">所需赋能服务模块（多选）</label>
                      <div className="grid grid-cols-2 gap-2">
                        {pwaServices.map(svc => {
                          const isChecked = serviceForm.selectedFeatures.includes(svc.id);
                          return (
                            <button
                              type="button"
                              key={svc.id}
                              onClick={() => toggleFeature(svc.id)}
                              className={`rounded-xl p-2.5 text-left border transition flex items-center gap-2 ${
                                isChecked
                                  ? 'border-amber-400 bg-amber-500/20 text-amber-200'
                                  : 'border-white/10 bg-white/5 text-white/60 hover:border-white/20'
                              }`}
                            >
                              <span className="text-base">{svc.icon}</span>
                              <div className="truncate">
                                <div className="font-semibold text-white truncate">{svc.title}</div>
                                <div className="text-[9px] text-white/40">{svc.badge}</div>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    <div>
                      <label className="block text-white/70 mb-1 font-medium">需求详细说明 / 预算预期（选填）</label>
                      <textarea
                        rows="2"
                        placeholder="请描述您的具体交付排期、当前社群规模或特殊定制要求..."
                        value={serviceForm.notes}
                        onChange={(e) => setServiceForm({ ...serviceForm, notes: e.target.value })}
                        className="w-full rounded-xl border border-white/15 bg-black/50 px-3.5 py-2 text-white placeholder-white/30 focus:border-amber-400 focus:outline-none"
                      />
                    </div>

                    <div className="pt-2">
                      <button
                        type="submit"
                        className="w-full rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 py-3 text-sm font-bold text-black hover:brightness-110 transition shadow-[0_0_25px_rgba(245,158,11,0.4)]"
                      >
                        确认提交需求单 →
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
