<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOORE LABS - Global Financial Layer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
  <style>
    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes ctaBaseFlow {
      0% { transform: translate3d(-2%, -1%, 0) scale(1.03); }
      50% { transform: translate3d(1%, 0.6%, 0) scale(1.06); }
      100% { transform: translate3d(3%, -0.4%, 0) scale(1.08); }
    }

    @keyframes heroBackdropShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 46% 48%; }
      100% { background-position: 100% 52%; }
    }

    @keyframes heroStreamSweep {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    @keyframes ctaStreamFlow {
      0% { transform: translate3d(-3%, -0.6%, 0) scale(1.04); opacity: 0.22; }
      50% { transform: translate3d(0.5%, 0.4%, 0) scale(1.08); opacity: 0.28; }
      100% { transform: translate3d(3%, 0.2%, 0) scale(1.1); opacity: 0.34; }
    }

    @keyframes ctaFloatA {
      0% { transform: translate3d(-2.4%, -0.8%, 0) scale(1.02); opacity: 0.22; }
      100% { transform: translate3d(2.8%, 0.6%, 0) scale(1.08); opacity: 0.3; }
    }

    @keyframes ctaFloatB {
      0% { transform: translate3d(2%, -0.4%, 0) scale(1.01); opacity: 0.2; }
      100% { transform: translate3d(-2.6%, 1.2%, 0) scale(1.07); opacity: 0.28; }
    }

    html {
      scroll-behavior: smooth;
    }

    .fade-up,
    .scenario-card,
    .timeline-card {
      transform-style: preserve-3d;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .shine-card {
      position: relative;
      isolation: isolate;
    }

    .shine-card::before,
    .shine-card::after {
      content: '';
      pointer-events: none;
    }

    .shine-card::before {
      position: absolute;
      inset: 0;
      opacity: 0.42;
      transition: opacity 280ms ease, filter 280ms ease;
    }

    .shine-card::after {
      position: absolute;
      inset-y: 0;
      left: -140%;
      width: 65%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
      opacity: 0;
      transition: transform 700ms ease, opacity 280ms ease;
    }

    .shine-card:hover::before {
      opacity: 0.88;
      filter: brightness(1.08);
    }

    .shine-card:hover::after {
      opacity: 1;
      transform: translateX(300%) rotate(18deg);
    }

    .card-hover-lift {
      cursor: pointer;
      transition: box-shadow 280ms ease, filter 280ms ease, border-color 280ms ease;
    }

    .card-hover-lift:hover {
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 34px rgba(123, 164, 255, 0.18), 0 22px 60px rgba(6, 14, 30, 0.22);
      filter: brightness(1.04);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .cap-card:hover {
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 0 28px rgba(255,255,255,0.05), 0 22px 56px rgba(0,0,0,0.22);
      filter: brightness(1.04);
    }

    .cap-stage {
      /* no contain needed for flow layout */
    }

    .cta-stage {
      background: #eef0f7;
    }

    .hero-phase,
    .cta-phase {
      background: linear-gradient(
        96deg,
        rgba(32, 8, 58, 0.08) 0%,
        rgba(64, 22, 118, 0.08) 18%,
        rgba(0, 0, 0, 0) 44%,
        rgba(0, 0, 0, 0) 58%,
        rgba(80, 160, 70, 0.05) 76%,
        rgba(164, 255, 62, 0.12) 90%,
        rgba(210, 255, 130, 0.05) 100%
      );
      background-size: 180% 100%;
      background-position: 100% 50%;
      mix-blend-mode: soft-light;
      filter: blur(48px) saturate(1.02);
      opacity: 0.2;
      will-change: opacity, transform;
    }

    .cta-base {
      background: linear-gradient(94deg, #211043 0%, #4b31b9 12%, #6c60df 24%, #bbbaf2 38%, #ece9f6 54%, #def0ff 66%, #dcf49d 82%, #f7f3ec 100%);
      background-size: 260% 220%;
      animation: ctaBaseFlow 16s ease-in-out infinite alternate;
      opacity: 1;
      will-change: transform;
    }

    .cta-stream {
      background: linear-gradient(
        102deg,
        rgba(111, 74, 255, 0.16) 0%,
        rgba(70, 149, 255, 0.14) 16%,
        rgba(255, 120, 210, 0.05) 30%,
        rgba(255, 255, 255, 0.04) 46%,
        rgba(214, 255, 110, 0.07) 62%,
        rgba(124, 255, 214, 0.05) 78%,
        rgba(255, 255, 255, 0.02) 100%
      );
      background-size: 260% 220%;
      opacity: 0.52;
      mix-blend-mode: soft-light;
      filter: blur(44px) saturate(1.01);
      animation: ctaStreamFlow 14s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .cta-mesh {
      mix-blend-mode: screen;
      filter: blur(54px) saturate(1.01);
      opacity: 0.52;
      will-change: transform, opacity;
    }

    .cta-mesh-a {
      background:
        radial-gradient(ellipse at 14% 22%, rgba(111, 74, 255, 0.34) 0%, transparent 32%),
        radial-gradient(ellipse at 34% 56%, rgba(77, 170, 255, 0.16) 0%, transparent 26%),
        radial-gradient(ellipse at 70% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 18%);
      animation: ctaFloatA 12s ease-in-out infinite alternate;
    }

    .cta-mesh-b {
      background:
        radial-gradient(ellipse at 82% 20%, rgba(214, 255, 100, 0.16) 0%, transparent 22%),
        radial-gradient(ellipse at 88% 54%, rgba(255, 246, 193, 0.12) 0%, transparent 18%),
        radial-gradient(ellipse at 54% 74%, rgba(112, 255, 218, 0.1) 0%, transparent 18%),
        radial-gradient(ellipse at 46% 28%, rgba(196, 202, 255, 0.08) 0%, transparent 18%);
      animation: ctaFloatB 14s ease-in-out infinite alternate;
    }

    .cta-vignette {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 20%),
        linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.008) 34%, rgba(20,24,38,0.02) 70%, rgba(10,14,24,0.04) 100%);
    }

    .hero-bg {
      background: #eef0f7;
    }

    .hero-base {
      background: linear-gradient(96deg, #241043 0%, #4f35bc 13%, #7368e4 26%, #dddafb 40%, #f5eff9 54%, #eaf5ff 66%, #eef8c5 80%, #f8f5ef 100%);
      background-size: 220% 220%;
      opacity: 1;
      will-change: transform, background-position;
      animation: heroBackdropShift 12s ease-in-out infinite alternate;
    }

    .hero-stream {
      background: linear-gradient(
        102deg,
        rgba(111, 74, 255, 0.24) 0%,
        rgba(70, 149, 255, 0.21) 18%,
        rgba(255, 120, 210, 0.07) 34%,
        rgba(255, 255, 255, 0.09) 49%,
        rgba(214, 255, 110, 0.08) 64%,
        rgba(124, 255, 214, 0.05) 80%,
        rgba(255, 255, 255, 0.03) 100%
      );
      background-size: 220% 220%;
      opacity: 0.78;
      mix-blend-mode: soft-light;
      filter: blur(48px);
      will-change: transform, opacity, background-position;
      animation: heroStreamSweep 11s ease-in-out infinite alternate;
    }

    .hero-mesh {
      mix-blend-mode: screen;
      filter: blur(56px);
      opacity: 0.62;
      will-change: transform, opacity;
    }

    .hero-mesh-a {
      background: radial-gradient(ellipse at 36% 34%, rgba(255, 255, 255, 0.26) 0%, transparent 28%),
        radial-gradient(ellipse at 16% 24%, rgba(111, 74, 255, 0.22) 0%, transparent 30%),
        radial-gradient(ellipse at 68% 26%, rgba(77, 170, 255, 0.13) 0%, transparent 24%);
    }

    .hero-mesh-b {
      background: radial-gradient(ellipse at 56% 40%, rgba(255, 255, 255, 0.18) 0%, transparent 26%),
        radial-gradient(ellipse at 84% 22%, rgba(214, 255, 100, 0.14) 0%, transparent 24%),
        radial-gradient(ellipse at 74% 62%, rgba(112, 255, 218, 0.1) 0%, transparent 20%);
    }

    .hero-mesh-c {
      background: radial-gradient(ellipse at 44% 48%, rgba(255, 255, 255, 0.16) 0%, transparent 26%),
        radial-gradient(ellipse at 62% 42%, rgba(196, 202, 255, 0.13) 0%, transparent 22%),
        radial-gradient(ellipse at 24% 78%, rgba(98, 130, 255, 0.1) 0%, transparent 18%),
        radial-gradient(ellipse at 52% 26%, rgba(138, 186, 255, 0.08) 0%, transparent 20%);
    }

    .animate-marquee {
      animation: marquee 26s linear infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useMemo, useRef } = React;

    gsap.registerPlugin(ScrollTrigger);

    const backers = [
      'Framework Ventures',
      'Avalanche',
      'Solana',
      'Vaulta',
      'Sonic',
      'Animoca',
      'Tencent Cloud',
      'Unified Ventures',
    ];

    const pillars = [
      {
        title: 'Innovative Governance',
        desc: 'Empower community members and institutions to participate in discussions and decision-making with speed, inclusiveness, and efficiency.',
      },
      {
        title: 'Universal DID System',
        desc: 'A decentralized identity layer that simplifies onboarding while meeting KYC and AML expectations across applications.',
      },
      {
        title: 'RWAs Tokenization',
        desc: 'Unlock tradable on-chain access to artworks, commodities, real estate, and other real-world assets.',
      },
      {
        title: 'On / Off Ramp',
        desc: 'A compliant user and institutional access layer that bridges fiat and on-chain participation more smoothly.',
      },
      {
        title: 'Plug and Play',
        desc: 'A modular architecture that gives builders a transparent, composable environment for compliant products.',
      },
    ];

    const capabilities = [
      'EVM Adaptation',
      'Low Fees',
      'Build On Trust',
      'Linking Global Markets',
      'Enterprise-grade Infra',
      'Universal DID System',
      'KYC / AML Compliant Network',
      'Reduce Costs',
    ];

    const scenarios = [
      'RWAs Tokenization',
      'Compliant On/Off Ramp',
      'Universal DID System',
      'Yield Bearing Stable Coin',
      'Crypto Payments and PayFi',
    ];

    const trends = [
      'Conscious Impact',
      'Adaptive Resilience',
      'Seamless Digital Integration',
      'Wellness-Centered Approach',
    ];

    const roadmap = [
      { time: '2025 Q2', title: 'SuperNova (Testnet)', points: ['Optimistic + zkEVM', 'Decentralized Sequencers'] },
      { time: '2025 Q4', title: 'Stella (Testnet)', points: ['zkEVM Upgrade'] },
      { time: '2026 Q1', title: 'Stella-Extension (Testnet)', points: ['Staking', 'MOORE LABS Points Rewards'] },
      { time: '2026 Q2', title: 'Nebula (Mainnet)', points: ['Mainnet Launch', 'Ecosystem Activation'] },
      { time: 'Future', title: 'To be continued…', points: ['Next-generation financial primitives'] },
    ];

    const capabilityLayouts = [
      { x: '50%', y: '38%', w: '29rem', h: '14rem', z: 3 },
      { x: '50%', y: '38%', w: '29rem', h: '14rem', z: 3 },
      { x: '50%', y: '38%', w: '29rem', h: '14rem', z: 3 },
      { x: '50%', y: '38%', w: '29rem', h: '14rem', z: 3 },
      { x: '50%', y: '38%', w: '29rem', h: '14rem', z: 3 },
    ];

    function cx(...parts) {
      return parts.filter(Boolean).join(' ');
    }

    function getShineCardClassName({ rounded, border, background, shadow, glow }) {
      return cx('shine-card relative overflow-hidden', rounded, border, background, shadow, glow);
    }

    function ArrowUpRight({ className }) {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          <path d="M7 7h10v10"/>
          <path d="M7 17 17 7"/>
        </svg>
      );
    }

    function SectionTitle({ eyebrow, title, subtitle }) {
      return (
        <div className="max-w-3xl space-y-3">
          {eyebrow ? <div className="text-xs uppercase tracking-[0.28em] text-white/78">{eyebrow}</div> : null}
          <h2 className="text-3xl font-semibold tracking-tight text-white md:text-5xl">{title}</h2>
          {subtitle ? <p className="text-sm leading-7 text-white/74 md:text-base">{subtitle}</p> : null}
        </div>
      );
    }

    function MooreLabsLanding() {
      const rootRef = useRef(null);
      const heroRef = useRef(null);
      const marquee = useMemo(() => [...backers, ...backers], []);

      useEffect(() => {
        const interactiveCards = [];

        const ctx = gsap.context(() => {
          gsap.from('.hero-reveal', {
            y: 28,
            opacity: 0,
            duration: 0.9,
            stagger: 0.1,
            ease: 'power3.out',
          });

          gsap.utils.toArray('.stagger-drop').forEach((group) => {
            const items = Array.from(group.querySelectorAll('.fade-up'));
            items.forEach((item, index) => {
              const direction = index % 2 === 0 ? -1 : 1;
              const fromX = direction * (16 + index * 7);
              const fromY = 86 + index * 20;
              const fromRotate = direction * (2.8 + index * 0.6);
              const endRotate = direction * (0.85 + index * 0.08);
              const endX = direction * (1.8 + index * 0.35);

              gsap.fromTo(
                item,
                {
                  y: fromY, x: fromX, rotateZ: fromRotate, rotateX: 2,
                  scale: 0.988, opacity: 0.16, transformOrigin: '50% 88%', force3D: true,
                },
                {
                  y: 0, x: endX, rotateZ: endRotate, rotateX: 0, scale: 1, opacity: 1, ease: 'none',
                  scrollTrigger: {
                    trigger: item,
                    start: () => `top ${98 - index * 6}%`,
                    end: () => `top ${70 - index * 4}%`,
                    scrub: true,
                  },
                }
              );
            });
          });

          const isDesktop = window.matchMedia('(min-width: 1024px)').matches;

          if (isDesktop) {
            const capCards = gsap.utils.toArray('.cap-card');

            capCards.forEach((card, index) => {
              const isLeft = index % 2 === 0;
              const entryX = isLeft ? -80 : 80;
              const entryRot = isLeft ? -14 : 14;
              const exitRot = isLeft ? 10 : -10;

              gsap.set(card, {
                y: 120, x: entryX, rotateZ: entryRot, scale: 0.92, autoAlpha: 0, force3D: true,
              });

              // Entry: bottom → center, tilted → straight
              gsap.to(card, {
                y: 0, x: 0, rotateZ: 0, scale: 1, autoAlpha: 1,
                duration: 1, ease: 'none',
                scrollTrigger: {
                  trigger: card,
                  start: 'top 105%',
                  end: 'top 50%',
                  scrub: 0.4,
                },
              });

              // Exit: center → top, straight → tilted
              gsap.to(card, {
                rotateZ: exitRot,
                duration: 1, ease: 'none',
                scrollTrigger: {
                  trigger: card,
                  start: 'bottom 35%',
                  end: 'bottom 0%',
                  scrub: 0.4,
                },
              });
            });
          }

          gsap.utils.toArray('.scenario-group').forEach((group) => {
            const items = Array.from(group.querySelectorAll('.scenario-card'));
            items.forEach((item, index) => {
              const direction = index % 2 === 0 ? 1 : -1;
              const fromX = direction * (18 + index * 8);
              const fromY = 96 + index * 22;
              const fromRotate = direction * (3 + index * 0.7);
              const endRotate = direction * (0.95 + index * 0.1);
              const endX = direction * (2.1 + index * 0.45);

              gsap.fromTo(
                item,
                {
                  y: fromY, x: fromX, rotateZ: fromRotate, rotateX: 2,
                  scale: 0.988, opacity: 0.14, transformOrigin: '50% 88%', force3D: true,
                },
                {
                  y: 0, x: endX, rotateZ: endRotate, rotateX: 0, scale: 1, opacity: 1, ease: 'none',
                  scrollTrigger: {
                    trigger: item,
                    start: () => `top ${99 - index * 6}%`,
                    end: () => `top ${72 - index * 4}%`,
                    scrub: true,
                  },
                }
              );
            });
          });

          gsap.utils.toArray('.timeline-card').forEach((card, index) => {
            const direction = index % 2 === 0 ? -1 : 1;
            const endX = direction * 1.1;
            const endRotate = direction * 0.55;

            gsap.fromTo(
              card,
              {
                y: 78, x: direction * 14, rotateZ: direction * 1.8, rotateX: 1.5,
                scale: 0.992, opacity: 0.2, transformOrigin: '50% 88%', force3D: true,
              },
              {
                y: 0, x: endX, rotateZ: endRotate, rotateX: 0, scale: 1, opacity: 1, ease: 'none',
                scrollTrigger: {
                  trigger: card,
                  start: () => `top ${99 - index * 4}%`,
                  end: () => `top ${74 - index * 3}%`,
                  scrub: true,
                },
              }
            );
          });

          gsap.utils.toArray('.card-interactive:not(.cap-card)').forEach((card) => {
            const onEnter = () => { gsap.to(card, { y: -4, scale: 1.008, duration: 0.24, ease: 'power2.out', overwrite: 'auto' }); };
            const onLeave = () => { gsap.to(card, { y: 0, scale: 1, duration: 0.28, ease: 'power2.out', overwrite: 'auto' }); };
            const onDown = () => { gsap.to(card, { y: -2, scale: 0.994, duration: 0.12, ease: 'power2.out', overwrite: 'auto' }); };
            const onUp = () => { gsap.to(card, { y: -4, scale: 1.008, duration: 0.16, ease: 'power2.out', overwrite: 'auto' }); };

            card.addEventListener('pointerenter', onEnter);
            card.addEventListener('pointerleave', onLeave);
            card.addEventListener('pointerdown', onDown);
            card.addEventListener('pointerup', onUp);
            card.addEventListener('pointercancel', onLeave);

            interactiveCards.push({ element: card, onEnter, onLeave, onDown, onUp });
          });

          if (heroRef.current) {
            gsap.to('.hero-shell', {
              y: 36, opacity: 0.88, ease: 'none',
              scrollTrigger: { trigger: heroRef.current, start: 'top top', end: 'bottom top', scrub: true },
            });
            gsap.to('.hero-content', {
              y: 22, ease: 'none',
              scrollTrigger: { trigger: heroRef.current, start: 'top top', end: 'bottom top', scrub: true },
            });
            gsap.to('.hero-glow-layer', {
              scale: 1.02, y: 8, opacity: 0.92, ease: 'none',
              scrollTrigger: { trigger: heroRef.current, start: 'top top', end: 'bottom top', scrub: true },
            });
          }

          gsap.to('.hero-base', { xPercent: 8, yPercent: -2.2, scale: 1.22, duration: 12, repeat: -1, yoyo: true, ease: 'sine.inOut' });
          gsap.to('.hero-stream', { xPercent: 12, yPercent: 1.8, scale: 1.26, duration: 10, repeat: -1, yoyo: true, ease: 'sine.inOut' });
          gsap.to('.hero-mesh-a', { xPercent: 9, yPercent: -2.8, scale: 1.18, duration: 14, repeat: -1, yoyo: true, ease: 'sine.inOut' });
          gsap.to('.hero-mesh-b', { xPercent: -8.5, yPercent: 3.2, scale: 1.2, duration: 17, repeat: -1, yoyo: true, ease: 'sine.inOut' });
          gsap.to('.hero-mesh-c', { xPercent: 7, yPercent: 2.6, scale: 1.16, duration: 19, repeat: -1, yoyo: true, ease: 'sine.inOut' });

          // Brand line scroll-driven stretch
          gsap.to('.brand-line', {
            scaleY: 1,
            ease: 'none',
            scrollTrigger: {
              trigger: '.brand-section',
              start: 'top 60%',
              end: 'bottom 70%',
              scrub: true,
            },
          });

          // Pillar rows staircase slide-in from left, scrub with scroll
          const pillarRows = gsap.utils.toArray('.pillar-row');
          const pillarContainer = document.querySelector('.pillar-container');
          if (pillarContainer && pillarRows.length) {
            const tl = gsap.timeline({
              scrollTrigger: {
                trigger: pillarContainer,
                start: 'top 90%',
                end: 'bottom 60%',
                scrub: 0.6,
              },
            });
            pillarRows.forEach((row, i) => {
              tl.from(row, {
                x: -(200 + i * 100),
                opacity: 0,
                duration: 1,
                ease: 'power2.out',
              }, i * 0.3);
            });
          }

          // Mobile capability cards - fixed title toggle + tilt entry/exit
          if (!isDesktop) {
            const mobileTitleEl = document.querySelector('.cap-mobile-title');
            const mobileStageEl = document.querySelector('.cap-stage-mobile');

            if (mobileTitleEl && mobileStageEl) {
              ScrollTrigger.create({
                trigger: mobileStageEl,
                start: 'top top',
                end: 'bottom 50%',
                onEnter: () => { mobileTitleEl.style.display = 'flex'; },
                onLeave: () => { mobileTitleEl.style.display = 'none'; },
                onEnterBack: () => { mobileTitleEl.style.display = 'flex'; },
                onLeaveBack: () => { mobileTitleEl.style.display = 'none'; },
              });
            }

            const mobileCards = gsap.utils.toArray('.cap-mobile-card');

            mobileCards.forEach((card, i) => {
              const isLeft = i % 2 === 0;
              const entryRot = isLeft ? -10 : 10;
              const exitRot = isLeft ? 8 : -8;

              gsap.set(card, {
                y: 80, x: isLeft ? -40 : 40, rotateZ: entryRot, scale: 0.94, autoAlpha: 0, force3D: true,
              });

              gsap.to(card, {
                y: 0, x: 0, rotateZ: 0, scale: 1, autoAlpha: 1,
                duration: 1, ease: 'none',
                scrollTrigger: {
                  trigger: card,
                  start: 'top 105%',
                  end: 'top 55%',
                  scrub: 0.4,
                },
              });

              gsap.to(card, {
                rotateZ: exitRot,
                duration: 1, ease: 'none',
                scrollTrigger: {
                  trigger: card,
                  start: 'bottom 35%',
                  end: 'bottom 0%',
                  scrub: 0.4,
                },
              });
            });
          }
        }, rootRef);

        return () => {
          interactiveCards.forEach(({ element, onEnter, onLeave, onDown, onUp }) => {
            element.removeEventListener('pointerenter', onEnter);
            element.removeEventListener('pointerleave', onLeave);
            element.removeEventListener('pointerdown', onDown);
            element.removeEventListener('pointerup', onUp);
            element.removeEventListener('pointercancel', onLeave);
          });
          ctx.revert();
          ScrollTrigger.getAll().forEach((trigger) => trigger.kill());
        };
      }, []);

      const capabilityCardClassName = getShineCardClassName({
        rounded: 'rounded-[24px]',
        border: 'border border-white/12',
        background: 'bg-[linear-gradient(180deg,rgba(24,36,62,0.86),rgba(13,20,36,0.9))]',
        shadow: 'shadow-[0_14px_44px_rgba(3,8,20,0.16)]',
