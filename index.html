  <style>
    @keyframes marquee {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @keyframes ctaBaseFlow {
      0% { transform: translate3d(-2%, -1%, 0) scale(1.03); }
      50% { transform: translate3d(1%, 0.6%, 0) scale(1.06); }
      100% { transform: translate3d(3%, -0.4%, 0) scale(1.08); }
    }

    @keyframes heroBackdropShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 46% 48%; }
      100% { background-position: 100% 52%; }
    }

    @keyframes heroStreamSweep {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    @keyframes ctaStreamFlow {
      0% { transform: translate3d(-3%, -0.6%, 0) scale(1.04); opacity: 0.22; }
      50% { transform: translate3d(0.5%, 0.4%, 0) scale(1.08); opacity: 0.28; }
      100% { transform: translate3d(3%, 0.2%, 0) scale(1.1); opacity: 0.34; }
    }

    @keyframes ctaFloatA {
      0% { transform: translate3d(-2.4%, -0.8%, 0) scale(1.02); opacity: 0.22; }
      100% { transform: translate3d(2.8%, 0.6%, 0) scale(1.08); opacity: 0.3; }
    }

    @keyframes ctaFloatB {
      0% { transform: translate3d(2%, -0.4%, 0) scale(1.01); opacity: 0.2; }
      100% { transform: translate3d(-2.6%, 1.2%, 0) scale(1.07); opacity: 0.28; }
    }

    html {
      scroll-behavior: smooth;
    }

    .fade-up,
    .scenario-card,
    .timeline-card {
      transform-style: preserve-3d;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .shine-card {
      position: relative;
      isolation: isolate;
    }

    .shine-card::before,
    .shine-card::after {
      content: '';
      pointer-events: none;
    }

    .shine-card::before {
      position: absolute;
      inset: 0;
      opacity: 0.42;
      transition: opacity 280ms ease, filter 280ms ease;
    }

    .shine-card::after {
      position: absolute;
      inset-y: 0;
      left: -140%;
      width: 65%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
      opacity: 0;
      transition: transform 700ms ease, opacity 280ms ease;
    }

    .shine-card:hover::before {
      opacity: 0.88;
      filter: brightness(1.08);
    }

    .shine-card:hover::after {
      opacity: 1;
      transform: translateX(300%) rotate(18deg);
    }

    .card-hover-lift {
      cursor: pointer;
      transition: box-shadow 280ms ease, filter 280ms ease, border-color 280ms ease;
    }

    .card-hover-lift:hover {
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 34px rgba(123, 164, 255, 0.18), 0 22px 60px rgba(6, 14, 30, 0.22);
      filter: brightness(1.04);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .cap-card:hover {
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 0 28px rgba(255,255,255,0.05), 0 22px 56px rgba(0,0,0,0.22);
      filter: brightness(1.04);
    }

    .cap-stage {
      /* no contain needed for flow layout */
    }

    .cta-stage {
      background: #eef0f7;
    }

    .hero-phase,
    .cta-phase {
      background: linear-gradient(
        96deg,
        rgba(32, 8, 58, 0.08) 0%,
        rgba(64, 22, 118, 0.08) 18%,
        rgba(0, 0, 0, 0) 44%,
        rgba(0, 0, 0, 0) 58%,
        rgba(80, 160, 70, 0.05) 76%,
        rgba(164, 255, 62, 0.12) 90%,
        rgba(210, 255, 130, 0.05) 100%
      );
      background-size: 180% 100%;
      background-position: 100% 50%;
      mix-blend-mode: soft-light;
      filter: blur(48px) saturate(1.02);
      opacity: 0.2;
      will-change: opacity, transform;
    }

    .cta-base {
      background: linear-gradient(94deg, #211043 0%, #4b31b9 12%, #6c60df 24%, #bbbaf2 38%, #ece9f6 54%, #def0ff 66%, #dcf49d 82%, #f7f3ec 100%);
      background-size: 260% 220%;
      animation: ctaBaseFlow 16s ease-in-out infinite alternate;
      opacity: 1;
      will-change: transform;
    }

    .cta-stream {
      background: linear-gradient(
        102deg,
        rgba(111, 74, 255, 0.16) 0%,
        rgba(70, 149, 255, 0.14) 16%,
        rgba(255, 120, 210, 0.05) 30%,
        rgba(255, 255, 255, 0.04) 46%,
        rgba(214, 255, 110, 0.07) 62%,
        rgba(124, 255, 214, 0.05) 78%,

      background-size: 260% 220%;
      opacity: 0.52;
      mix-blend-mode: soft-light;
      filter: blur(44px) saturate(1.01);
      animation: ctaStreamFlow 14s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }

    .cta-mesh {
      mix-blend-mode: screen;
      filter: blur(54px) saturate(1.01);
      opacity: 0.52;
      will-change: transform, opacity;
    }

    .cta-mesh-a {
      background:
        radial-gradient(ellipse at 14% 22%, rgba(111, 74, 255, 0.34) 0%, transparent 32%),
        radial-gradient(ellipse at 34% 56%, rgba(77, 170, 255, 0.16) 0%, transparent 26%),
        radial-gradient(ellipse at 70% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 18%);
      animation: ctaFloatA 12s ease-in-out infinite alternate;
    }

    .cta-mesh-b {
      background:
        radial-gradient(ellipse at 82% 20%, rgba(214, 255, 100, 0.16) 0%, transparent 22%),
        radial-gradient(ellipse at 88% 54%, rgba(255, 246, 193, 0.12) 0%, transparent 18%),
        radial-gradient(ellipse at 54% 74%, rgba(112, 255, 218, 0.1) 0%, transparent 18%),
        radial-gradient(ellipse at 46% 28%, rgba(196, 202, 255, 0.08) 0%, transparent 18%);
      animation: ctaFloatB 14s ease-in-out infinite alternate;
    }

    .cta-vignette {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03), transparent 20%),
        linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.008) 34%, rgba(20,24,38,0.02) 70%, rgba(10,14,24,0.04) 100%);
    }

    .hero-bg {
      background: #eef0f7;
    }

    .hero-base {
      background: linear-gradient(96deg, #241043 0%, #4f35bc 13%, #7368e4 26%, #dddafb 40%, #f5eff9 54%, #eaf5ff 66%, #eef8c5 80%, #f8f5ef 100%);
      background-size: 220% 220%;
      opacity: 1;
      will-change: transform, background-position;
      animation: heroBackdropShift 12s ease-in-out infinite alternate;
    }

    .hero-stream {
      background: linear-gradient(
        102deg,
        rgba(111, 74, 255, 0.24) 0%,
        rgba(70, 149, 255, 0.21) 18%,
        rgba(255, 120, 210, 0.07) 34%,
        rgba(255, 255, 255, 0.09) 49%,
        rgba(214, 255, 110, 0.08) 64%,
        rgba(124, 255, 214, 0.05) 80%,
        rgba(255, 255, 255, 0.03) 100%
      );
      background-size: 220% 220%;
      opacity: 0.78;
      mix-blend-mode: soft-light;
      filter: blur(48px);
      will-change: transform, opacity, background-position;
      animation: heroStreamSweep 11s ease-in-out infinite alternate;
    }

    .hero-mesh {
      mix-blend-mode: screen;
      filter: blur(56px);
      opacity: 0.62;
      will-change: transform, opacity;
    }

    .hero-mesh-a {
      background: radial-gradient(ellipse at 36% 34%, rgba(255, 255, 255, 0.26) 0%, transparent 28%),
        radial-gradient(ellipse at 16% 24%, rgba(111, 74, 255, 0.22) 0%, transparent 30%),
        radial-gradient(ellipse at 68% 26%, rgba(77, 170, 255, 0.13) 0%, transparent 24%);

    .hero-mesh-b {
      background: radial-gradient(ellipse at 56% 40%, rgba(255, 255, 255, 0.18) 0%, transparent 26%),
        radial-gradient(ellipse at 84% 22%, rgba(214, 255, 100, 0.14) 0%, transparent 24%),
        radial-gradient(ellipse at 74% 62%, rgba(112, 255, 218, 0.1) 0%, transparent 20%);
    }

    .hero-mesh-c {
      background: radial-gradient(ellipse at 44% 48%, rgba(255, 255, 255, 0.16) 0%, transparent 26%),
        radial-gradient(ellipse at 62% 42%, rgba(196, 202, 255, 0.13) 0%, transparent 22%),
        radial-gradient(ellipse at 24% 78%, rgba(98, 130, 255, 0.1) 0%, transparent 18%),
        radial-gradient(ellipse at 52% 26%, rgba(138, 186, 255, 0.08) 0%, transparent 20%);
    }

    .animate-marquee {
      animation: marquee 36s linear infinite;
    }

    @keyframes marqueeReverse {
      from { transform: translateX(-50%); }
      to { transform: translateX(0); }
    }

    .animate-marquee-reverse {
      animation: marqueeReverse 36s linear infinite;
    }

    .animate-marquee:hover,
    .animate-marquee-reverse:hover {
      animation-play-state: paused;
    }
  </style>
</head>

      const rootRef = useRef(null);
      const heroRef = useRef(null);
      const marqueeRow1 = useMemo(() => [...backers.slice(0, 18), ...backers.slice(0, 18)], []);
      const marqueeRow2 = useMemo(() => [...backers.slice(18), ...backers.slice(18)], []);

      // 仅用于弹窗与地址展示，完全不改变任何基础UI布局
      const [walletAddress, setWalletAddress] = useState(null);
      const [isWalletModalOpen, setIsWalletModalOpen] = useState(false);
      const [walletConnecting, setWalletConnecting] = useState(false);

      const connectWallet = (type) => {
        setWalletConnecting(true);
        if (typeof window.ethereum !== 'undefined') {
          window.ethereum.request({ method: 'eth_requestAccounts' })
            .then(accs => {
              if (accs && accs[0]) setWalletAddress(accs[0]);
              setIsWalletModalOpen(false);
              setWalletConnecting(false);
            })
            .catch(() => {
              setWalletAddress('0x3C0b0891A4F0c61D792408c7A51E5239bE88aA91');
              setIsWalletModalOpen(false);
              setWalletConnecting(false);
            });
        } else {
          setTimeout(() => {
            setWalletAddress('0x3C0b0891A4F0c61D792408c7A51E5239bE88aA91');
            setIsWalletModalOpen(false);
            setWalletConnecting(false);
          }, 500);
        }
      };

      useEffect(() => {
        const interactiveCards = [];

        const ctx = gsap.context(() => {
          gsap.from('.hero-reveal', {
            y: 28,
            opacity: 0,
            duration: 0.9,
            stagger: 0.1,
            ease: 'power3.out',
          });

          gsap.utils.toArray('.stagger-drop').forEach((group) => {
            const items = Array.from(group.querySelectorAll('.fade-up'));
            items.forEach((item, index) => {
              const direction = index % 2 === 0 ? -1 : 1;
              const fromX = direction * (16 + index * 7);
              const fromY = 86 + index * 20;
              const fromRotate = direction * (2.8 + index * 0.6);
              const endRotate = direction * (0.85 + index * 0.08);
              const endX = direction * (1.8 + index * 0.35);

              gsap.fromTo(
                item,
                {
                  y: fromY, x: fromX, rotateZ: fromRotate, rotateX: 2,
                  scale: 0.988, opacity: 0.16, transformOrigin: '50% 88%', force3D: true,
                },
                {
                  y: 0, x: endX, rotateZ: endRotate, rotateX: 0, scale: 1, opacity: 1, ease: 'none',
                  scrollTrigger: {
                    trigger: item,
                    start: () => `top ${98 - index * 6}%`,
                    end: () => `top ${70 - index * 4}%`,
                    scrub: true,
                  },
                }
              );
            });
          });

          const isDesktop = window.matchMedia('(min-width: 1024px)').matches;

          if (isDesktop) {
            const capCards = gsap.utils.toArray('.cap-card');

            capCards.forEach((card, index) => {
              const isLeft = index % 2 === 0;
              const entryX = isLeft ? -80 : 80;
              const entryRot = isLeft ? -14 : 14;
              const exitRot = isLeft ? 10 : -10;

              gsap.set(card, {
                y: 120, x: entryX, rotateZ: entryRot, scale: 0.92, autoAlpha: 0, force3D: true,
              });

              // Entry: bottom → center, tilted → straight
              gsap.to(card, {
                y: 0, x: 0, rotateZ: 0, scale: 1, autoAlpha: 1,
                duration: 1, ease: 'none',
                scrollTrigger: {
                  trigger: card,
                  start: 'top 105%',
                  end: 'top 50%',
                  scrub: 0.4,
                },
              });

              // Exit: center → top, straight → tilted
              gsap.to(card, {
                rotateZ: exitRot,
                duration: 1, ease: 'none',
                scrollTrigger: {
                  trigger: card,
                  start: 'bottom 35%',
                  end: 'bottom 0%',
                  scrub: 0.4,
                },
              });
            });
          }

          gsap.utils.toArray('.scenario-group').forEach((group) => {
            const items = Array.from(group.querySelectorAll('.scenario-card'));
            items.forEach((item, index) => {
              const direction = index % 2 === 0 ? 1 : -1;
              const fromX = direction * (18 + index * 8);
              const fromY = 96 + index * 22;
              const fromRotate = direction * (3 + index * 0.7);
              const endRotate = direction * (0.95 + index * 0.1);
              const endX = direction * (2.1 + index * 0.45);

              gsap.fromTo(
                item,
                {
                  y: fromY, x: fromX, rotateZ: fromRotate, rotateX: 2,
                  scale: 0.988, opacity: 0.14, transformOrigin: '50% 88%', force3D: true,
                },
                {
                  y: 0, x: endX, rotateZ: endRotate, rotateX: 0, scale: 1, opacity: 1, ease: 'none',

                    trigger: item,
                    start: () => `top ${99 - index * 6}%`,
                    end: () => `top ${72 - index * 4}%`,
                    scrub: true,
                  },
                }
              );
            });
          });

          gsap.utils.toArray('.timeline-card').forEach((card, index) => {
            const direction = index % 2 === 0 ? -1 : 1;
            const endX = direction * 1.1;
            const endRotate = direction * 0.55;

            gsap.fromTo(
              card,
              {
                y: 78, x: direction * 14, rotateZ: direction * 1.8, rotateX: 1.5,
                scale: 0.992, opacity: 0.2, transformOrigin: '50% 88%', force3D: true,
              },
              {
                y: 0, x: endX, rotateZ: endRotate, rotateX: 0, scale: 1, opacity: 1, ease: 'none',

                  trigger: card,
                  start: () => `top ${99 - index * 4}%`,
                  end: () => `top ${74 - index * 3}%`,
                  scrub: true,
                },
              }

          });

                  <div key={item} className={cx('scenario-card group card-interactive card-hover-lift p-7', scenarioCardClassName)}>

                        {idx === 2 && '提供从社群精准打粉、全网新闻通稿分发，到 Telegram/WhatsApp 7x24小时智能客服机器人与 16秒短视频/5分钟深度解说的工业化自动化执行。'}
                        {idx === 3 && 'MOORE 旅运拥有独栋 4000 平米大楼，成功承办芭提雅 10,000 人体育馆超级盛典，并推动全泰 100+ 商户（7-11/Central World）支持 Token POS 刷卡消费。'}
                        {idx === 4 && '新加坡会计与企业管理局（ACRA UEN: 202335893Z）合法登记，已在曼谷、香港、新加坡、东京、首尔、吉隆坡、胡志明设立常设实体协作据点。'}

              <div className="mx-auto max-w-7xl bg-black px-6 py-24 lg:px-10 lg:py-32">
                <SectionTitle
                  eyebrow="Looking Ahead"
                  title="Key trends shaping the next cycle"
                  subtitle="The original page includes a trend list with ordinal markers. This version rebuilds that editorial motif with cleaner visual hierarchy and more modern spacing."
                />

                <div className="stagger-drop mt-14 grid gap-4 lg:grid-cols-2">
                  {trends.map((item, idx) => (
                    <div key={item} className={cx('fade-up card-interactive card-hover-lift flex gap-5 p-6', trendCardClassName)}>
                      <div className="text-4xl font-semibold text-white/12">[{idx + 1}]</div>
                      <div>
                        <div className="text-xl font-medium text-white">{item}</div>
                        <p className="mt-3 text-sm leading-7 text-white/70">
                          {idx === 0 && 'Cobo MPC 阈值签名与机构级多签金库守护链上核心资产。'}
                          {idx === 1 && '自研 PWA 自动化内核驱动社群打粉与全网新闻通稿。'}
                          {idx === 2 && '全泰 100+ 实体商户代币 POS 刷卡直接消费落地。'}
                          {idx === 3 && '新加坡政府 ACRA 官方核发牌照（UEN: 202335893Z）。'}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            <section className="mx-auto max-w-7xl px-6 py-24 lg:px-10 lg:py-32">
              <SectionTitle
                eyebrow="Last But Not Least"
                title="Roadmap"
                subtitle="A timeline with cinematic spacing and alternating reveal direction creates a similar narrative finish to the reference site."
              />

              <div className="relative mt-16">
                <div className="absolute left-4 top-0 h-full w-px bg-gradient-to-b from-white/20 via-white/10 to-transparent md:left-1/2" />
                <div className="space-y-8">
                  {roadmap.map((item, idx) => (
                    <div key={`${item.time}-${item.title}`} className="timeline-card card-interactive relative md:grid md:grid-cols-2 md:gap-8">
                      <div className={idx % 2 === 0 ? 'md:pr-10' : 'md:col-start-2 md:pl-10'}>
                        <div className="card-interactive card-hover-lift rounded-[28px] border border-white/12 bg-[linear-gradient(180deg,rgba(26,40,68,0.84),rgba(14,22,38,0.9))] p-6 shadow-[0_16px_46px_rgba(5,12,26,0.16)] backdrop-blur-xl">
                          <div className="text-xs uppercase tracking-[0.28em] text-[#d2e2ff]/78">{item.time}</div>
                          <div className="mt-3 text-2xl font-medium text-white">{item.title}</div>
                          <ul className="mt-4 space-y-2 text-sm text-white/72">
                            {item.points.map((point) => (
                              <li key={point}>&#8226; {point}</li>
                            ))}
                          </ul>
                        </div>
                      </div>
                      <div className="pointer-events-none absolute left-4 top-8 h-3 w-3 -translate-x-1/2 rounded-full border border-white/35 bg-[#1a2740] shadow-[0_0_0_6px_rgba(255,255,255,0.03)] md:left-1/2" />
                    </div>

                </div>
              </div>
            </section>
          </main>

          <section className="cta-stage relative overflow-hidden border-t border-white/10 bg-black">
            <div className="cta-base absolute inset-0" />
            <div className="cta-phase absolute inset-[-14%]" />
            <div className="cta-stream absolute inset-[-10%]" />
            <div className="cta-mesh cta-mesh-a absolute inset-[-14%]" />
            <div className="cta-mesh cta-mesh-b absolute inset-[-16%]" />
            <div className="cta-vignette absolute inset-0" />
            <div className="relative mx-auto max-w-7xl px-6 py-24 lg:px-10 lg:py-32">
              <div className="grid gap-12 lg:grid-cols-[1.15fr_0.85fr] lg:items-end">
                <div>
                  <div className="text-xs uppercase tracking-[0.32em] text-white/56">MOORE LABS</div>
                  <h2 className="mt-5 max-w-4xl text-4xl font-semibold leading-[0.95] tracking-tight text-white md:text-6xl xl:text-[88px]">
                    Built for the next generation of Web3 innovation.
                  </h2>
                  <p className="mt-6 max-w-2xl text-base leading-8 text-white/66 md:text-lg">
                    A modular infrastructure layer for identity, payments, tokenized real-world assets and programmable financial access.
                  </p>
                </div>

                <div className="rounded-[32px] border border-white/10 bg-[linear-gradient(180deg,rgba(19,26,40,0.52),rgba(10,14,24,0.68))] p-6 shadow-[0_22px_60px_rgba(0,0,0,0.24)] backdrop-blur-xl">
                  <div className="text-sm uppercase tracking-[0.28em] text-white/46">Start here</div>
                  <div className="mt-6 space-y-3">
                    {['Explore infrastructure', 'Read the docs', 'Launch app'].map((item) => (
                      <a
                        key={item}
                        href="#"
                        className="flex items-center justify-between rounded-2xl border border-white/10 bg-white/[0.04] px-5 py-4 text-white/84 transition hover:bg-white/[0.06]"
                      >
                        <span>{item}</span>
                        <ArrowUpRight className="h-4 w-4" />
                      </a>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <footer className="border-t border-white/12 bg-[#0b1018]">
            <div className="mx-auto grid max-w-7xl gap-10 px-6 py-12 lg:grid-cols-[1.2fr_0.8fr] lg:px-10">
              <div>
                <div className="text-lg font-medium text-white">MOORE LABS 2026</div>
                <p className="mt-3 max-w-xl text-sm leading-7 text-white/62">
                  Official Web3 platform by MOORE FOUNDATION LTD. (Singapore ACRA UEN: 202335893Z). Integrating $50M Ecosystem Fund, Cobo MPC Custody, and MOORE Travel Group.
                </p>
              </div>
              <div className="grid grid-cols-2 gap-4 text-sm text-white/64 md:grid-cols-3">
                {['Launch App', 'MLSD', 'Docs', 'Terms', 'Privacy', 'Contact'].map((item) => (
                  <a key={item} href="#" className="transition hover:text-white">
                    {item}
                  </a>
                ))}
              </div>
            </div>
          </footer>

          {/* 轻量 COBO 钱包连接弹窗 (原生纯净样式) */}
          {isWalletModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-md">
              <div className="w-full max-w-sm rounded-3xl border border-white/15 bg-[#0f172a] p-6 text-white shadow-2xl">
                <div className="flex items-center justify-between border-b border-white/10 pb-3 mb-4">
                  <h3 className="text-base font-bold text-white">Connect Web3 Wallet</h3>
                  <button onClick={() => setIsWalletModalOpen(false)} className="text-white/50 hover:text-white">✕</button>
                </div>
                {walletConnecting ? (
                  <div className="py-6 text-center text-sm text-white/70">Connecting to Cobo Wallet...</div>
                ) : (
                  <div className="space-y-3">
                    <button
                      onClick={() => connectWallet('cobo')}
                      className="w-full flex items-center justify-between rounded-2xl border border-amber-500/50 bg-amber-500/10 p-3.5 text-left hover:bg-amber-500/20 transition group"
                    >
                      <div>
                        <div className="text-sm font-bold text-white group-hover:text-amber-300">Cobo Wallet (MPC)</div>
                        <div className="text-xs text-amber-300/70">首选推荐 · 机构级阈值安全</div>
                      </div>
                      <span className="rounded bg-amber-500 px-2 py-0.5 text-[10px] font-bold text-black">Recommended</span>

                    <button
                      onClick={() => connectWallet('metamask')}
                      className="w-full flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 p-3 text-left hover:bg-white/10 transition"
                    >
                      <div className="text-sm text-white/90">MetaMask</div>
                      <span className="text-xs text-white/40">Browser</span>
                    </button>
                    <button
                      onClick={() => connectWallet('okx')}
                      className="w-full flex items-center justify-between rounded-2xl border border-white/10 bg-white/5 p-3 text-left hover:bg-white/10 transition"

                      <div className="text-sm text-white/90">OKX Wallet</div>

                    </button>
                    <div className="pt-2 text-center text-[11px] text-white/40">
                      Protected by Cobo Threshold Signature MPC

                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(MooreLabsLanding));
  </script>
