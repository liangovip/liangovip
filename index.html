    }

      inset: 0;
      opacity: 0.42;
      transition: opacity 280ms ease, filter 280ms ease;
    }

    .shine-card::after {
      position: absolute;
      inset-y: 0;
      left: -140%;
      width: 65%;
      transform: rotate(18deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
      opacity: 0;
      transition: transform 700ms ease, opacity 280ms ease;
    }

    .shine-card:hover::before {
      opacity: 0.88;
      filter: brightness(1.08);
    }

    .shine-card:hover::after {

      transform: translateX(300%) rotate(18deg);

      will-change: transform;

        const scrollToHashTarget = () => {
          const hash = window.location.hash;
          if (!hash || hash === '#' || hash.startsWith('#/')) return;
          const targetId = decodeURIComponent(hash.slice(1));
          let targetEl = document.getElementById(targetId);
          if (!targetEl) {
            try { targetEl = document.querySelector(hash); } catch (e) {}
          }
          if (!targetEl) return;

          const mobileTitleEl = document.querySelector('.cap-mobile-title');
          if (mobileTitleEl && targetId !== 'what-s-new') {
            mobileTitleEl.style.display = 'none';
          }
          ScrollTrigger.refresh();
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

          // 基於真實時鐘與定時器的雙重平滑滾動兜底，確保在各類設備、無頭瀏覽器與合成器下均能 100% 平滑精準落位到 scroll-mt 補償處
          const scrollMarginTop = parseFloat(window.getComputedStyle(targetEl).scrollMarginTop) || 0;
          const startY = window.scrollY;
          const targetY = Math.max(0, startY + targetEl.getBoundingClientRect().top - scrollMarginTop);
          const startTime = performance.now();
          const duration = 360;

          const step = (now) => {
            const elapsed = now - startTime;
            const progress = Math.min(1, elapsed / duration);
            const ease = 1 - Math.pow(1 - progress, 3);
            window.scrollTo(0, startY + (targetY - startY) * ease);
            if (progress < 1) {
              requestAnimationFrame(step);
            }
          };
          requestAnimationFrame(step);
          setTimeout(() => {
            targetEl.scrollIntoView({ behavior: 'instant', block: 'start' });
            ScrollTrigger.update();
          }, duration + 20);
        };

        let hashTimer1 = null;
        if (window.location.hash && window.location.hash !== '#') {
          hashTimer1 = setTimeout(scrollToHashTarget, 80);
        }
        window.addEventListener('hashchange', scrollToHashTarget);

        const handleAnchorClick = (e) => {
          const anchor = e.target.closest('a[href^="#"]');
          if (!anchor) return;
          const href = anchor.getAttribute('href');
          if (!href || href === '#') return;
          const targetId = decodeURIComponent(href.slice(1));
          const targetEl = document.getElementById(targetId) || document.querySelector(href);
          if (targetEl) {
            e.preventDefault();
            if (window.location.hash !== href) {
              history.pushState(null, '', href);
            }
            scrollToHashTarget();
          }
        };

                                  <div className="mb-1 h-4 w-4 shrink-0 rounded-full bg-[#dcc89c]" />
                                  <p className="max-w-[20rem] text-[1rem] leading-7 text-white/88">
                                    {t.capabilitiesCardDesc[idx] || t.capabilitiesCardDesc[0]}
                                  </p>
                                </div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ON-CHAIN ASSETS outline text section */}
            <section className="on-chain-section relative overflow-hidden bg-black py-24 lg:py-32">
              <div className="mx-auto flex flex-col items-center px-6">
                {/* Chain-link logo */}
                <svg className="mb-10 h-12 w-12 text-white/70" viewBox="0 0 48 48" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M18 12h-2a8 8 0 0 0 0 16h2M30 12h2a8 8 0 0 1 0 16h-2M16 20h16" />
                </svg>
                {/* ON-CHAIN ASSETS large outline text */}
                <div className="on-chain-text w-full text-center">
                  <span style={{
                    fontSize: 'clamp(3rem, 10vw, 9rem)',
                    fontWeight: 800,
                    lineHeight: 1,
                    letterSpacing: '-0.03em',
                    WebkitTextStroke: '1.5px rgba(255,255,255,0.5)',
                    color: 'transparent',
                    textTransform: 'uppercase',
                  }}>
                    ON-CHAIN ASSETS
                  </span>
                </div>
              </div>
            </section>

            <section id="here-it-is" className="relative z-10 scroll-mt-24 mx-auto max-w-7xl px-5 py-12 sm:px-6 sm:py-20 lg:px-10 lg:py-28">
              <SectionTitle
                eyebrow={t.scenariosEyebrow}
                title={t.scenariosTitle}
                subtitle={t.scenariosDesc}
              />

              <div className="scenario-group mt-8 sm:mt-14 grid gap-5 md:grid-cols-2 xl:grid-cols-3">
                {t.scenarios.map((item, idx) => (
                  <div key={item.title || item} className={cx('scenario-card group card-interactive card-hover-lift p-5 sm:p-6 md:p-7 flex flex-col', scenarioCardClassName)}>
                    <div className="absolute inset-0 rounded-[30px] bg-[radial-gradient(circle_at_bottom_right,rgba(138,170,255,0.12),transparent_40%)] opacity-0 transition duration-500 group-hover:opacity-100 pointer-events-none" />
                    <div className="relative flex flex-col flex-1">
                      {/* 會議實況高清照片 */}
                      {item.image && (
                        <div className="relative mb-5 w-full h-48 md:h-52 overflow-hidden rounded-2xl border border-white/10 bg-slate-900/60 shadow-inner group/img">
                          <img
                            src={item.image}
                            alt={item.title}
                            loading="eager"
                            className="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-105 group-hover/img:scale-105"
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent pointer-events-none" />
                          <div className="absolute top-3 right-3 rounded-full border border-emerald-400/30 bg-black/70 px-3 py-1 text-xs font-semibold text-emerald-400 backdrop-blur-md shadow-sm">
                            {item.scale}
                          </div>
                          <div className="absolute bottom-3 left-3 flex items-center gap-2 text-xs text-white/95">
                            <div className="relative flex h-2.5 w-2.5 items-center justify-center">
                              <span className="radar-ring" />
                              <span className="relative inline-block h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.9)]" />
                            </div>
                            <span className="font-mono tracking-wide font-medium">{item.location}</span>
                          </div>
                        </div>
                      )}

                      <div className="flex items-baseline justify-between mb-2">
                        <div className="text-3xl font-bold tracking-tight text-white/20 font-mono">0{idx + 1}</div>
                        {item.date && (
                          <div className="text-xs uppercase tracking-wider text-sky-400/90 font-mono">{item.date}</div>
                        )}
                      </div>
                      <h3 className="text-xl font-semibold text-white group-hover:text-sky-300 transition-colors duration-300">{item.title || item}</h3>
                      <p className="mt-3 text-sm leading-relaxed text-white/70 flex-1">
                        {item.desc || (t.scenariosCardDesc && t.scenariosCardDesc[idx]) || ''}
                      </p>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            <section className="border-y border-white/10 bg-white/[0.02]">
              <div className="mx-auto max-w-7xl bg-black px-6 py-24 lg:px-10 lg:py-32">
                <SectionTitle
                  eyebrow={t.trendsEyebrow}
                  title={t.trendsTitle}
                  subtitle={t.trendsDesc}
                />

                <div className="stagger-drop mt-14 grid gap-4 lg:grid-cols-2">
                  {t.trends.map((item, idx) => (
                    <div key={item} className={cx('fade-up card-interactive card-hover-lift flex gap-4 sm:gap-5 p-5 sm:p-6 items-start', trendCardClassName)}>
                      <div className="text-2xl sm:text-4xl font-bold font-mono text-white/20 shrink-0 leading-tight">0{idx + 1}</div>
                      <div className="flex-1 min-w-0">
                        <div className="text-base sm:text-xl font-semibold text-white leading-snug">{item}</div>
                        <p className="mt-2.5 text-xs sm:text-sm leading-relaxed sm:leading-7 text-white/70">
                          {t.trendsCardDesc[idx] || t.trendsCardDesc[0]}
                        </p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            <section id="roadmap" className="scroll-mt-20 mx-auto max-w-7xl px-6 py-24 lg:px-10 lg:py-32">
              <SectionTitle
                eyebrow={t.roadmapEyebrow}
                title={t.roadmapTitle}
                subtitle={t.roadmapDesc}
              />

              <div className="relative mt-16">
                <div className="absolute left-4 top-0 h-full w-px bg-gradient-to-b from-white/20 via-white/10 to-transparent md:left-1/2" />
                <div className="space-y-8">
                  {t.roadmap.map((item, idx) => (
                    <div key={`${item.time}-${item.title}`} className="timeline-card card-interactive relative md:grid md:grid-cols-2 md:gap-8">
                      <div className={idx % 2 === 0 ? 'pl-8 sm:pl-10 md:pl-0 md:pr-10' : 'pl-8 sm:pl-10 md:pl-10 md:col-start-2'}>
                        <div className="card-interactive card-hover-lift rounded-[28px] border border-white/12 bg-[linear-gradient(180deg,rgba(26,40,68,0.84),rgba(14,22,38,0.9))] p-6 shadow-[0_16px_46px_rgba(5,12,26,0.16)] backdrop-blur-xl">
                          <div className="text-[11px] sm:text-xs uppercase tracking-[0.24em] sm:tracking-[0.28em] text-amber-400 font-mono font-semibold">{item.time}</div>
                          <div className="mt-2 sm:mt-3 text-lg sm:text-2xl font-semibold text-white leading-snug">{item.title}</div>
                          <ul className="mt-3 sm:mt-4 space-y-2 text-xs sm:text-sm text-white/75 leading-relaxed">
                            {item.points.map((point) => (
                              <li key={point} className="flex items-start gap-2">
                                <span className="text-amber-400/80 shrink-0">&#8226;</span>
                                <span className="flex-1">{point}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      </div>
                      <div className="pointer-events-none absolute left-4 top-8 h-3 w-3 -translate-x-1/2 rounded-full border border-white/35 bg-[#1a2740] shadow-[0_0_0_6px_rgba(255,255,255,0.03)] md:left-1/2" />
                    </div>
                  ))}
                </div>
              </div>
            </section>
          </main>

          <section className="cta-stage relative overflow-hidden border-t border-white/10 bg-black">
            <div className="cta-base absolute inset-0" />
            <div className="cta-phase absolute inset-[-14%]" />
            <div className="cta-stream absolute inset-[-10%]" />
            <div className="cta-mesh cta-mesh-a absolute inset-[-14%]" />
            <div className="cta-mesh cta-mesh-b absolute inset-[-16%]" />
            <div className="cta-vignette absolute inset-0" />
            <div className="relative mx-auto max-w-7xl px-6 py-24 lg:px-10 lg:py-32">
              <div className="grid gap-12 lg:grid-cols-[1.15fr_0.85fr] lg:items-end">
                <div>
                  <div className="text-xs uppercase tracking-[0.32em] text-white/56">{t.ctaTag}</div>
                  <h2 className="mt-5 max-w-4xl text-3xl sm:text-4xl md:text-6xl xl:text-[88px] font-bold leading-tight sm:leading-[0.98] tracking-tight text-white">
                    {t.ctaTitle}
                  </h2>
                  <p className="mt-6 max-w-2xl text-base leading-8 text-white/66 md:text-lg">
                    {t.ctaDesc}
                  </p>
                </div>

                <div className="rounded-[32px] border border-white/10 bg-[linear-gradient(180deg,rgba(19,26,40,0.52),rgba(10,14,24,0.68))] p-6 shadow-[0_22px_60px_rgba(0,0,0,0.24)] backdrop-blur-xl">
                  <div className="text-sm uppercase tracking-[0.28em] text-white/46">Start here</div>
                  <div className="mt-6 space-y-3">
                    {t.ctaLinks.map((item, idx) => (
                      <a
                        key={item}
                        href={idx === 0 ? '#why-moore-labs' : idx === 1 ? '#here-it-is' : '#backers'}
                        className="flex items-center justify-between rounded-2xl border border-white/10 bg-white/[0.04] px-5 py-4 text-white/84 transition hover:bg-white/[0.06]"
                      >
                        <span>{item}</span>
                        <ArrowUpRight className="h-4 w-4" />
                      </a>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <footer className="border-t border-white/12 bg-[#0b1018]">
            <div className="mx-auto grid max-w-7xl gap-10 px-6 py-12 lg:grid-cols-[1.2fr_0.8fr] lg:px-10">
              <div>
                <div className="text-lg font-medium text-white">MOORE LABS 2026</div>
                <p className="mt-3 max-w-xl text-sm leading-7 text-white/62">
                  {t.footerText}
                </p>
              </div>
              <div className="grid grid-cols-2 gap-4 text-sm text-white/64 md:grid-cols-3">
                {['Overview', 'MLSD', 'Docs', 'Terms', 'Privacy', 'Contact'].map((item) => (
                  <a key={item} href="#" className="transition hover:text-white">
                    {item}
                  </a>
                ))}
              </div>
            </div>
          </footer>

          {/* 輕量 Wallet MPC 門限安全錢包連接彈窗 (原生純淨高質感) */}
          

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(MooreLabsLanding));
  </script>
</body>
</html>
